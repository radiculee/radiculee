<svg width="560" height="208" viewBox="0 0 560 208" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Hi, I'm Vedant. Data and AI builder. I build AI agents, data pipelines and BI dashboards. Open to work on innovative projects.</title>
  <style>
    .bubble {
      fill: #1f6feb;
    }
    text {
      fill: #ffffff;
      font-size: 17px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .dot {
      fill: #ffffff;
    }

    .msg {
      opacity: 0;
      animation: msg-in 0.25s ease-out forwards;
    }
    .typing {
      opacity: 0;
      animation: typing 1.2s linear;
    }

    .typing-1 { animation-delay: 0.2s; }
    .msg-1 { animation-delay: 1.4s; }
    .typing-2 { animation-delay: 1.9s; }
    .msg-2 { animation-delay: 3.1s; }
    .typing-3 { animation-delay: 3.6s; }
    .msg-3 { animation-delay: 4.8s; }
    .typing-4 { animation-delay: 5.3s; }
    .msg-4 { animation-delay: 6.5s; }

    @keyframes msg-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes typing {
      0%, 100% {
        opacity: 0;
      }
      15%, 85% {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg {
        animation: none;
        opacity: 1;
      }
      .typing {
        animation: none;
      }
    }
  </style>

  <g transform="translate(8 8)">
    <g class="typing typing-1">
      <rect class="bubble" width="64" height="40" rx="20"/>
      <circle class="dot" cx="20" cy="20" r="3.5"/><circle class="dot" cx="32" cy="20" r="3.5"/><circle class="dot" cx="44" cy="20" r="3.5"/>
    </g>
    <g class="msg msg-1">
      <rect class="bubble" width="150" height="40" rx="20"/>
      <text x="18" y="26">Hi, I'm Vedant</text>
    </g>
  </g>

  <g transform="translate(8 56)">
    <g class="typing typing-2">
      <rect class="bubble" width="64" height="40" rx="20"/>
      <circle class="dot" cx="20" cy="20" r="3.5"/><circle class="dot" cx="32" cy="20" r="3.5"/><circle class="dot" cx="44" cy="20" r="3.5"/>
    </g>
    <g class="msg msg-2">
      <rect class="bubble" width="190" height="40" rx="20"/>
      <text x="18" y="26">Data and AI builder</text>
    </g>
  </g>

  <g transform="translate(8 104)">
    <g class="typing typing-3">
      <rect class="bubble" width="64" height="40" rx="20"/>
      <circle class="dot" cx="20" cy="20" r="3.5"/><circle class="dot" cx="32" cy="20" r="3.5"/><circle class="dot" cx="44" cy="20" r="3.5"/>
    </g>
    <g class="msg msg-3">
      <rect class="bubble" width="456" height="40" rx="20"/>
      <text x="18" y="26">I build AI agents, data pipelines and BI dashboards</text>
    </g>
  </g>

  <g transform="translate(8 152)">
    <g class="typing typing-4">
      <rect class="bubble" width="64" height="40" rx="20"/>
      <circle class="dot" cx="20" cy="20" r="3.5"/><circle class="dot" cx="32" cy="20" r="3.5"/><circle class="dot" cx="44" cy="20" r="3.5"/>
    </g>
    <g class="msg msg-4">
      <rect class="bubble" width="316" height="40" rx="20"/>
      <text x="18" y="26">Open to work on innovative projects</text>
    </g>
  </g>
</svg>
